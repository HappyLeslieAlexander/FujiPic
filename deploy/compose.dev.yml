name: fujipic-dev

services:
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  createbucket:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/fujipic &&
        mc anonymous set none local/fujipic &&
        echo 'bucket fujipic ready (private)'
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8080
      LISTEN_ADDR: :8080
      DATABASE_PATH: /data/fujipic.db
      TMP_DIR: /data/tmp
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: fujipic
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      ALLOW_OPEN_REGISTRATION: "true"
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: admin-password-123
      LOG_LEVEL: debug
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data

volumes:
  minio-data:
  app-data:
